name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/explorer/**'
      - 'packages/shared/**'
      - 'packages/shared-react/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-pages-explorer.yml'
      - '.github/workflows/sync-upstream-explorer.yml'
      - '.github/scripts/merge-upstream*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VITE_BACKEND_URL: https://backend.mainnet.alephium.org
  VITE_NETWORK_TYPE: mainnet
  VITE_NODE_URL: https://node.mainnet.alephium.org

jobs:
  build-explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: apps/explorer/.nvmrc
          cache: pnpm

      - name: Install explorer dependencies
        run: pnpm install --filter @alephium/explorer... --filter alephium-frontend --frozen-lockfile --config.node-linker=isolated

      - name: Check explorer
        run: |
          pnpm --filter @alephium/explorer lint
          pnpm --filter @alephium/explorer test

      - name: Build explorer
        working-directory: apps/explorer
        env:
          EXPLORER_BASE_PATH: /
        run: pnpm run build:gh-pages && pnpm init-docker

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/explorer/build

  # Give the artifact service time to publish the upload before deploy-pages lists it.
  # https://github.com/actions/deploy-pages/issues/451
  deploy-pages-explorer:
    needs: build-explorer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://frontend.alephium.notrustverify.ch
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.build-explorer.outputs.artifact_name }}
