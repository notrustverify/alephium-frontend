name: Deploy explorer to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VITE_BACKEND_URL: https://backend.mainnet.alephium.org
  VITE_NETWORK_TYPE: mainnet
  VITE_NODE_URL: https://node.mainnet.alephium.org

jobs:
  deploy-pages-explorer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build explorer
        working-directory: apps/explorer
        env:
          EXPLORER_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run build:gh-pages && pnpm init-docker

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/explorer/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
